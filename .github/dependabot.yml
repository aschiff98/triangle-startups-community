version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '10:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '10:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ['*']
