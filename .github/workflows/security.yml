name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/community-gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/community-gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/community-gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/community-gitleaks.toml"
      - name: Verify the scanner detects a synthetic token
        run: |
          mkdir "$RUNNER_TEMP/community-secret-probe"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import {randomBytes} from "node:crypto"; writeFileSync(process.env.RUNNER_TEMP + "/community-secret-probe/example.txt", "token=" + "gh" + "p_" + randomBytes(24).toString("hex").slice(0,36))'
          probe_status=0
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/community-secret-probe" \
            --config "$RUNNER_TEMP/community-gitleaks.toml" --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --redact=100 --no-banner \
            --report-format json --report-path "$RUNNER_TEMP/community-secret-probe.json" \
            > "$RUNNER_TEMP/community-secret-probe.log" 2>&1 || probe_status=$?
          test "$probe_status" -eq 1
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const report=JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/community-secret-probe.json", "utf8")); if (!report.some(f => f.RuleID === "github-pat")) process.exit(1)'
      - name: Scan repository history with built-in rules and redacted output
        run: |
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" \
            --config "$RUNNER_TEMP/community-gitleaks.toml" --gitleaks-ignore-path /dev/null \
            --ignore-gitleaks-allow --redact=100 --no-banner

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          warn-only: false

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Audit the full committed lockfile, without installing or executing packages.
      - run: npm audit --package-lock-only --ignore-scripts --include=dev --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Neither language needs an app build or dependency install for analysis.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: always
      # Upload success alone does not mean there were no blocking findings.
      - name: Reject high-severity findings and scan errors
        run: node tools/check-codeql-results.mjs codeql-results
